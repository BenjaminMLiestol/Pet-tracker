# Two walks reach the goal: the count goes to 2/2 with the "goal reached" check.
appId: com.benjaminliestol.pettracker
---
- launchApp
- runFlow:
    file: ../subflows/goto-tab.yaml
    env:
      TAB: "tab-walk"
      EXPECT: "Logg tur|Log a walk"
- tapOn: "Logg tur|Log a walk"
- tapOn: "Logg tur|Log a walk"
- assertVisible: "Målet er nådd|Goal reached"
- runFlow:
    file: ../subflows/goto-tab.yaml
    env:
      TAB: "tab-home"
      EXPECT: ".*: [0-9]+ / [0-9]+.*"
- assertVisible: ".*: 2 / 2.*"
