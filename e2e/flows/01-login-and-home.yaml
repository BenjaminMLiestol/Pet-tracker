# Sign in with the throwaway test account and check Home shows the new dog with the default
# goals (1 feeding, 2 walks). Texts are matched in Norwegian and English.
appId: com.benjaminliestol.pettracker
---
# Start from a clean app, so signing in is the first thing that happens: whoever was signed in
# before (you, or an earlier test run) is gone, and there is nothing to sign out of.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Velkommen tilbake|Welcome back"
    timeout: 30000
- tapOn:
    id: "email"
- inputText: ${E2E_EMAIL}
- tapOn:
    id: "password"
- inputText: ${E2E_PASSWORD}
- tapOn: "Logg inn|Log in"
# Decline the Face ID offer: nothing about the test account may be saved on the phone.
- runFlow:
    when:
      visible: "Ikke nå|Not now"
    commands:
      - tapOn: "Ikke nå|Not now"
- assertVisible: ".*E2E Dog.*"
- assertVisible: ".*: 0 / 1"
- assertVisible: ".*: 0 / 2"
